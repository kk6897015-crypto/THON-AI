name: Keep Render Awake

on:
  schedule:
    - cron: '*/14 * * * *'   # Trigger every 14 minutes to prevent Render free instance spin-down
  workflow_dispatch:          # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Render Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          URL="https://thon-ai-2.onrender.com/api/health"
          echo "Pinging Render health endpoint at $URL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
          echo "HTTP response status code: $HTTP_CODE"
