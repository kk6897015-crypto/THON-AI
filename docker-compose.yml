version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamlaunch_postgres
    environment:
      POSTGRES_USER: teamlaunch
      POSTGRES_PASSWORD: teamlaunch_secret_password
      POSTGRES_DB: teamlaunch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: teamlaunch_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: teamlaunch_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://teamlaunch:teamlaunch_secret_password@postgres:5432/teamlaunch_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-teamlaunch-jwt-key-2026
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: teamlaunch_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
